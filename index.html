<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para ti, mi amor ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #080808;
            color: #f5eee8;
            font-family: Georgia, "Times New Roman", serif;
            overflow-x: hidden;
        }

        /* =========================
           BLOQUEO DE LA PORTADA
        ========================= */

        body.portada-activa {
            overflow: hidden;
            height: 100vh;
        }

        /* =========================
           SECCIONES
        ========================= */

        section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 70px 25px;
            position: relative;
        }

        .contenedor {
            width: 100%;
            max-width: 850px;
            margin: auto;
            text-align: center;
        }

        /* =========================
           PORTADA
        ========================= */

        .portada {
            min-height: 100vh;
            height: 100vh;
            background:
                radial-gradient(circle at center, #211719 0%, #080808 55%);
            flex-direction: column;

            position: fixed;
            inset: 0;
            z-index: 9999;

            transition:
                opacity 1.2s ease,
                visibility 1.2s ease;
        }

        .portada.cerrada {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .mini-texto {
            font-size: 12px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #bda7a1;
            margin-bottom: 35px;
            animation: aparecer 2s ease;
        }

        .portada h1 {
            font-size: clamp(55px, 15vw, 125px);
            font-weight: normal;
            letter-spacing: 3px;
            margin-bottom: 20px;
            animation: aparecer 2.5s ease;
        }

        .portada h2 {
            font-size: clamp(20px, 5vw, 32px);
            font-weight: normal;
            font-style: italic;
            color: #d9bdb8;
            margin-bottom: 50px;
            animation: aparecer 3s ease;
        }

        .boton {
            display: inline-block;
            padding: 16px 35px;
            border: 1px solid #9e7772;
            color: #f5eee8;
            text-decoration: none;
            letter-spacing: 3px;
            font-size: 12px;
            transition: 0.4s;
            animation: aparecer 3.5s ease;
            cursor: pointer;
        }

        .boton:hover {
            background: #f5eee8;
            color: #080808;
        }

        /* =========================
           TITULOS
        ========================= */

        .numero {
            font-size: 12px;
            letter-spacing: 4px;
            color: #9e7772;
            margin-bottom: 20px;
        }

        h3 {
            font-size: clamp(35px, 9vw, 65px);
            font-weight: normal;
            margin-bottom: 35px;
        }

        .texto {
            max-width: 700px;
            margin: auto;
            font-size: 18px;
            line-height: 1.9;
            color: #d8cfcb;
        }

        .texto p {
            margin-bottom: 25px;
        }

        /* =========================
           DOS MESES
        ========================= */

        .dos-meses {
            background: #0d0b0b;
        }

        .frase-grande {
            font-size: clamp(25px, 6vw, 45px);
            line-height: 1.5;
            font-style: italic;
            margin: 45px auto;
            max-width: 700px;
        }

        .destacado {
            color: #d9aaa4;
        }

        /* =========================
           FOTOS TEMPORALES
        ========================= */

        .foto-placeholder {
            width: min(90%, 500px);
            height: 480px;
            margin: 45px auto;
            border: 1px solid #4b3937;
            background:
                linear-gradient(135deg, #171212, #2a1d1d);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #806c68;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

           CARTAS
